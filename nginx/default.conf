server {
    listen 80;
    server_name _;

    # Default nginx limit is 1m; allow large screen recordings (backend caps at 512MB).
    client_max_body_size 520m;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Browser navigations (document requests) to mixed SPA/API paths should load index.html.
    # API calls use sec-fetch-mode=cors/same-origin and continue to the backend.
    location = /proposals {
        if ($http_sec_fetch_mode = "navigate") {
            rewrite ^ /index.html last;
        }
        if ($http_sec_fetch_dest = "document") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /audit {
        if ($http_sec_fetch_mode = "navigate") {
            rewrite ^ /index.html last;
        }
        if ($http_sec_fetch_dest = "document") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /stats {
        if ($http_sec_fetch_mode = "navigate") {
            rewrite ^ /index.html last;
        }
        if ($http_sec_fetch_dest = "document") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Existing mixed path: /settings serves SPA for document navigations, API for fetch clients.
    location = /settings {
        if ($http_sec_fetch_mode = "navigate") {
            rewrite ^ /index.html last;
        }
        if ($http_sec_fetch_dest = "document") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /settings/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mixed path: /projects serves SPA for document navigations, API for fetch clients.
    location = /projects {
        if ($http_sec_fetch_mode = "navigate") {
            rewrite ^ /index.html last;
        }
        if ($http_sec_fetch_dest = "document") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Workspace deep links like /projects/<uuid> must load the SPA on reload,
    # while the app's own fetch calls to the same paths reach the API.
    location ^~ /projects/ {
        if ($http_sec_fetch_mode = "navigate") {
            rewrite ^ /index.html last;
        }
        if ($http_sec_fetch_dest = "document") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mixed path: /contacts serves SPA for document navigations, API for fetch clients.
    location = /contacts {
        if ($http_sec_fetch_mode = "navigate") {
            rewrite ^ /index.html last;
        }
        if ($http_sec_fetch_dest = "document") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /contacts/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE endpoint: disable buffering so token deltas reach the client immediately.
    location = /turns/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location ~ ^/(health|claims|proposals|turns|voice|auth|audit|stats|mail|calendar|files|llm|conversations) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
