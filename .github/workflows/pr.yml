name: PR Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-lint-type-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/pyproject.toml

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Ruff check
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        run: python -m ruff check backend/app backend/tests

      - name: Ruff format check
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        run: python -m ruff format --check backend/app backend/tests

      - name: MyPy
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        run: python -m mypy --config-file backend/pyproject.toml backend/app backend/tests

      - name: Pytest
        if: ${{ hashFiles('backend/tests/**/*.py', 'backend/test_*.py', 'backend/**/*test*.py') != '' }}
        run: python -m pytest -q --cov=backend/app/api --cov=backend/app/services --cov=backend/app/schemas --cov-report=term-missing --cov-fail-under=80 backend/tests

  python-db-migration-sanity:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ozy_ci
          POSTGRES_PASSWORD: ci_postgres_password
          POSTGRES_DB: ozymandias
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ozy_ci -d ozymandias"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: Run Alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://ozy_ci:ci_postgres_password@localhost:5432/ozymandias
        run: alembic upgrade head

  rust-core-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Cargo fmt check
        run: cargo fmt -- --check

      - name: Cargo test workspace
        run: cargo test --workspace

      - name: Cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  bindings-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Install maturin
        run: python -m pip install --upgrade pip maturin

      - name: Build and install bindings
        run: |
          maturin build -m rust/ozy-bindings/Cargo.toml
          pip install --find-links rust/target/wheels/ ozy-bindings

      - name: Smoke import and call
        run: |
          python - <<'PY'
          import json
          import ozy_bindings

          payload = {
              "intent_type": "analyze",
              "available_tokens": 1000,
              "claims_count": 10,
          }
          out = ozy_bindings.allocate_token_budget(json.dumps(payload))
          parsed = json.loads(out)
          assert parsed["max_claims"] == 10
          assert parsed["max_tokens_per_claim"] == 100
          PY

  frontend-lint-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Vitest
        run: npm run test

  security-baseline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements-dev.txt ]; then pip install -r backend/requirements-dev.txt; fi

      - name: pip-audit
        if: ${{ hashFiles('backend/requirements.txt') != '' }}
        run: python -m pip_audit -r backend/requirements.txt

      - name: Bandit
        if: ${{ hashFiles('backend/**/*.py') != '' }}
        run: python -m bandit -r backend/app

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
