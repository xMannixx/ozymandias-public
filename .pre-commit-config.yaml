repos:
  # Python: Ruff Linter + Formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Rust: cargo fmt
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: bash -c 'cd rust && cargo fmt -- --check'
        language: system
        files: ^rust/
        pass_filenames: false

      # Rust: cargo clippy
      - id: cargo-clippy
        name: cargo clippy
        entry: bash -c 'cd rust && cargo clippy --all-targets -- -D warnings'
        language: system
        files: ^rust/
        pass_filenames: false

  # Secrets: Gitleaks
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3
    hooks:
      - id: gitleaks
