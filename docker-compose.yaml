services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ozy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ozy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: ozy-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-pic_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-pic_minio_secret_change_me}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  db-init:
    image: postgres:17-alpine
    container_name: ozy-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - ./docs/spec/OZY_DB_Schema.sql:/schema.sql:ro
    command: >
      sh -c "
      psql -h postgres -c 'CREATE EXTENSION IF NOT EXISTS vector;';
      psql -h postgres -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;';
      psql -h postgres -f /schema.sql
      "
    restart: "no"

  pg-backup:
    image: postgres:17-alpine
    container_name: ozy-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - pg_backups:/backups
    command: >
      sh -c "
      while true; do
        TS=$$(date +%Y%m%d_%H%M);
        pg_dump -h postgres | gzip > /backups/ozy_backup_$${TS}.sql.gz;
        find /backups -name 'ozy_backup_*.sql.gz' -mtime +7 -delete;
        sleep 86400;
      done
      "

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: ozy-backend
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_started
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUTH_DEV_BYPASS: ${AUTH_DEV_BYPASS:-false}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_BYPASS: ${AUTH_DEV_BYPASS:-false}
    container_name: ozy-frontend-build
    restart: unless-stopped
    volumes:
      - frontend_dist:/output

  nginx:
    image: nginx:1.28-alpine
    container_name: ozy-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    ports:
      - "8080:80"
    volumes:
      - frontend_dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  # NIEMALS mit docker-compose down -v loeschen — enthaelt alle Claims/Memory (Postgres-Daten).
  postgres_data:
  pg_backups:
  redis_data:
  minio_data:
  frontend_dist:
